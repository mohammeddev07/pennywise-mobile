name: EAS Update (OTA)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "EAS Update channel to publish to"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: eas update --branch ${{ inputs.channel }} --message "Manual OTA update (${{ github.sha }})" --non-interactive
